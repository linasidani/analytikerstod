<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analyst Support Tool</title>
</head>
<body>

    <h1>Analyst Support Tool</h1>

    <form method="get">
        <input
            type="text"
            name="q"
            value="{{ q }}"
            placeholder="Search for a person"
        >

        <button type="submit">Search</button>
    </form>

    {% for result in results %}
        <h2>{{ result["person"]["name"] }}</h2>

        <p>{{ result["person"]["notes"] }}</p>

        <h3>Organisations</h3>

        {% for organisation in result["organisations"] %}

            <p>{{ organisation["name"] }}</p>

        {% endfor %}

    {% endfor %}

</body>
</html>
